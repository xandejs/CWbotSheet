name: Bot Craft World

# O disparo é feito pelo Apps Script (gatilhoBotCW, a cada 15 min, via workflow_dispatch).
# NÃO reative o `schedule:` abaixo junto com o Apps Script: duplicaria execuções.

on:
  workflow_dispatch: {}

  # schedule:
  #   - cron: '*/15 * * * *'

# Uma execução por vez. Não cancela a que está rodando; a seguinte entra na fila.
concurrency:
  group: craft-world-bot
  cancel-in-progress: false

jobs:
  rodar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # reduza depois de medir o tempo real (ex.: 2x a duração normal)

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Cache incremental de indicadores + modelo pooled (ver CACHE_DIR no bot).
      - name: Restaurar cache incremental
        uses: actions/cache@v4
        with:
          path: cache_craft_world
          key: cache-craft-world-${{ github.run_id }}
          restore-keys: |
            cache-craft-world-

      - name: Rodar bot
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python bot_craft_world.py
